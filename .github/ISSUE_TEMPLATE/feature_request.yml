name: Feature request
description: An idea that would make DexTor OS for Windows better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or problem behind the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea of the solution. Sketches and examples from other apps are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Workarounds you use today, or other ideas you considered.
