name: Build

# Builds the published source on a clean Windows machine. The tests run before every release on
# our own machines: many of them drive real Windows UI, processes and devices.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        shell: pwsh
        run: dotnet build DexTor.sln -c Release
